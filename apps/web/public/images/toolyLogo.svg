<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 640" width="904" height="640" role="img" aria-label="Logo Tooly animé" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gem" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="0.6" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#d45bd0"/>
    </linearGradient>
    <linearGradient id="redfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f06a6e"/>
      <stop offset="1" stop-color="#e8212f"/>
    </linearGradient>
  </defs>
  <style>
    .fb { transform-box: fill-box; transform-origin: center; }

    /* Entrée du chariot puis rebond continu */
    @keyframes drive-in { from { transform: translateX(-60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    #cart { animation: drive-in 0.9s cubic-bezier(.2,.9,.3,1.2) both, bounce 1.4s ease-in-out 0.9s infinite; }

    /* Roues */
    @keyframes spin { to { transform: rotate(360deg); } }
    .wheel { animation: spin 0.9s linear infinite; }

    /* Lignes de vitesse */
    @keyframes dash {
      0%   { transform: translateX(40px); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateX(-30px); opacity: 0; }
    }
    .speed { animation: dash 1.2s ease-out infinite; }
    .s2 { animation-delay: 0.2s; }
    .s3 { animation-delay: 0.4s; }

    /* Icônes qui jaillissent et flottent */
    @keyframes pop { 0% { transform: translateY(140px) scale(.3) rotate(0deg); opacity: 0; } 70% { opacity: 1; } 100% { transform: translateY(0) scale(1) rotate(var(--r)); opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-14px) rotate(calc(var(--r) + 4deg)); } }
    .icon { opacity: 0; }
    .i1 { --r: -8deg;  animation: pop .8s cubic-bezier(.2,1.3,.4,1) .3s forwards, float 2.6s ease-in-out 1.1s infinite; }
    .i2 { --r: -3deg;  animation: pop .8s cubic-bezier(.2,1.3,.4,1) .45s forwards, float 2.9s ease-in-out 1.25s infinite; }
    .i3 { --r: 12deg;  animation: pop .8s cubic-bezier(.2,1.3,.4,1) .6s forwards, float 2.7s ease-in-out 1.4s infinite; }
    .i4 { --r: 12deg;  animation: pop .8s cubic-bezier(.2,1.3,.4,1) .75s forwards, float 3s ease-in-out 1.55s infinite; }
    .i5 { --r: 0deg;   animation: pop .8s cubic-bezier(.2,1.3,.4,1) .9s forwards, float 2.5s ease-in-out 1.7s infinite; }
    .i0 { --r: -6deg;  animation: pop .8s cubic-bezier(.2,1.3,.4,1) .2s forwards, float 3.1s ease-in-out 1s infinite; }

    /* Détails */
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .gem-star { animation: pulse 1.8s ease-in-out infinite; }
    .burst { animation: spin 6s linear infinite; }
    @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.3) rotate(72deg); } }
    .star { animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes flag { 0%,100% { transform: skewY(0deg); } 50% { transform: skewY(-2deg); } }
    .flag { animation: flag 1.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <!-- Lignes de vitesse -->
  <g>
    <rect class="speed fb" x="85" y="342" width="165" height="38" rx="19" fill="url(#redfade)"/>
    <rect class="speed s2 fb" x="150" y="402" width="130" height="36" rx="18" fill="url(#redfade)"/>
    <rect class="speed s3 fb" x="220" y="463" width="88" height="32" rx="16" fill="url(#redfade)"/>
  </g>

  <g id="cart">
    <!-- Icônes -->
    <!-- Arrière bleu -->
    <g class="icon i0 fb">
      <rect x="318" y="238" width="300" height="140" rx="22" fill="#1b86c4"/>
    </g>
    <!-- Gemini -->
    <g class="icon i1 fb">
      <rect x="200" y="96" width="165" height="200" rx="34" fill="#eef0f4"/>
      <path class="gem-star fb" d="M300 135 Q306 175 338 180 Q306 188 298 232 Q290 190 240 203 Q285 185 300 135Z" fill="url(#gem)"/>
    </g>
    <!-- Canva -->
    <g class="icon i2 fb">
      <rect x="345" y="50" width="165" height="200" rx="34" fill="#12a6bd"/>
      <text x="427" y="143" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="52" fill="#fff">Canva</text>
    </g>
    <!-- CapCut -->
    <g class="icon i3 fb">
      <rect x="505" y="82" width="180" height="195" rx="30" fill="#14161c"/>
      <path d="M545 160 L628 150 M548 205 L632 160 M545 160 L625 205 M552 180 L625 180" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>
    <!-- LinkedIn -->
    <g class="icon i4 fb">
      <rect x="620" y="172" width="190" height="190" rx="30" fill="#0a66c2"/>
      <circle cx="696" cy="222" r="11" fill="#fff"/>
      <rect x="686" y="242" width="20" height="55" fill="#fff"/>
      <path d="M722 242 H741 V250 Q752 240 766 242 Q790 244 790 272 V297 H770 V275 Q770 260 758 260 Q742 260 742 278 V297 H722Z" fill="#fff"/>
    </g>
    <!-- Orange burst -->
    <g class="icon i5 fb">
      <rect x="375" y="185" width="172" height="190" rx="30" fill="#f2985d"/>
      <g class="burst fb" stroke="#fff" stroke-width="7" stroke-linecap="round">
        <line x1="468" y1="252" x2="468" y2="236"/><line x1="468" y1="288" x2="468" y2="304"/>
        <line x1="450" y1="270" x2="434" y2="270"/><line x1="486" y1="270" x2="502" y2="270"/>
        <line x1="455" y1="257" x2="444" y2="246"/><line x1="481" y1="283" x2="492" y2="294"/>
        <line x1="481" y1="257" x2="492" y2="246"/><line x1="455" y1="283" x2="444" y2="294"/>
        <line x1="460" y1="253" x2="454" y2="240"/><line x1="476" y1="287" x2="482" y2="300"/>
        <line x1="476" y1="253" x2="482" y2="240"/><line x1="460" y1="287" x2="454" y2="300"/>
      </g>
    </g>

    <!-- Poignée + panier -->
    <path d="M140 262 H262 Q274 262 281 273 L322 338 H705 L598 515 Q588 540 562 540 H395 Q368 540 360 515 L322 350 Z" fill="#1d2029"/>
    <path d="M322 338 H705" stroke="#fff" stroke-width="5" fill="none" opacity=".9"/>

    <!-- Drapeau tunisien -->
    <g class="flag fb">
      <path d="M505 445 Q515 370 690 335 H755 Q785 335 775 372 L742 495 Q730 522 700 525 H600 Q500 525 505 445Z" fill="#fff"/>
      <path d="M522 445 Q532 380 695 342 H755 Q776 342 768 372 L738 490 Q728 515 700 518 H602 Q520 518 522 445Z" fill="#e8212f"/>
      <circle cx="645" cy="437" r="56" fill="#fff"/>
      <circle cx="645" cy="437" r="44" fill="#e8212f"/>
      <circle cx="658" cy="437" r="35" fill="#fff"/>
      <path class="star fb" d="M672 421 L677 433 L690 433 L680 441 L684 453 L672 446 L660 453 L664 441 L654 433 L667 433Z" fill="#e8212f"/>
    </g>

    <!-- Roues -->
    <g class="wheel fb"><circle cx="418" cy="585" r="42" fill="#1d2029"/><circle cx="418" cy="563" r="6" fill="#4a4f5e"/></g>
    <g class="wheel fb"><circle cx="622" cy="580" r="42" fill="#1d2029"/><circle cx="622" cy="558" r="6" fill="#4a4f5e"/></g>
  </g>
</svg>
