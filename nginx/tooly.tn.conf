# ==============================================================================
# Tooly.tn - Nginx Reverse Proxy Configuration
# ==============================================================================
# Domain: tooly.tn / www.tooly.tn (also supports tooy.tn / www.tooy.tn)
# Web Port: 3000 (Next.js 15)
# API Port: 4000 (NestJS REST API)
# Existing website backend on Port 5000 is completely untouched and preserved.
# ==============================================================================

# Upstream definitions with keepalive connections for optimal performance
upstream tooly_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tooly_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# 1. HTTP Server - Redirects all traffic to HTTPS (preserving ACME verification)
server {
    listen 80;
    listen [::]:80;
    server_name tooly.tn www.tooly.tn tooy.tn www.tooy.tn;

    # Let's Encrypt ACME verification directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Main Application & API Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tooly.tn www.tooly.tn tooy.tn www.tooy.tn;

    # SSL Certificates (Existing Let's Encrypt certificates on VPS)
    ssl_certificate /etc/letsencrypt/live/tooly.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tooly.tn/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Maximum file upload size (for admin catalog & avatar uploads)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/tooly.tn.access.log;
    error_log /var/log/nginx/tooly.tn.error.log warn;

    # --------------------------------------------------------------------------
    # Next.js Static Optimization & Caching
    # --------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/tooly/apps/web/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static media files
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|mp4|webm)$ {
        root /var/www/tooly/apps/web/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy_web;
    }

    # Uploaded media from API (prefix match with ^~ ensures static disk serving takes precedence over regex rules)
    location ^~ /uploads/ {
        alias /var/www/tooly/apps/api/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy_api;
    }

    # Backward compatibility rewrite for /api/uploads/ -> /uploads/
    location ^~ /api/uploads/ {
        rewrite ^/api/uploads/(.*)$ /uploads/$1 last;
    }

    # --------------------------------------------------------------------------
    # NestJS REST API Proxy (Port 4000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://tooly_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for real-time and streaming endpoints
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Named proxy location for API uploads fallback
    location @proxy_api {
        proxy_pass http://tooly_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Next.js Storefront Web Proxy (Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://tooly_web;
        proxy_http_version 1.1;

        # WebSocket support for Next.js Fast Refresh and streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Named proxy location for static files fallback
    location @proxy_web {
        proxy_pass http://tooly_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

